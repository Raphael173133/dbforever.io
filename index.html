```html
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Dragon Ball Forever - Accueil</title>
  <meta name="description" content="Ce site parle de l'univers de Dragon Ball, l'encyclopédie et l'histoire de Son Goku.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Changa+One&family=Rajdhani:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">

  <style>
    /* Évite les débordements horizontaux */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
      overflow-x: clip;
    }

    body.welcome-body {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 24px 16px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      gap: 24px;

      background: #0f051d url("wallpaper_gogeta_blue.webp")
        center center / cover no-repeat fixed;

      font-family: 'Rajdhani', sans-serif;
      overflow-wrap: break-word;
    }

    /* En-tête transparent */
    .main-container.welcome-container {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      margin: 10px 0 0;
      padding: 0;

      display: flex;
      flex-direction: column;
      align-items: center;

      background: transparent !important;
      border: none !important;
      box-shadow: none !important;

      text-align: center;
    }

    /* Titre adaptatif */
    .main-container.welcome-container h1 {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      margin: 0 0 12px;
      padding: 0;

      font-family: 'Changa One', cursive, sans-serif;
      font-size: clamp(1.7rem, 6vw, 3.8rem);
      line-height: 1.15;
      letter-spacing: clamp(0px, 0.4vw, 2px);

      color: #ffffff;
      text-align: center;
      text-shadow:
        3px 3px 6px rgba(0, 0, 0, 0.9),
        0 0 15px rgba(0, 150, 255, 0.6);

      overflow-wrap: anywhere;
    }

    /* Texte de bienvenue adaptatif */
    .welcome-text {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      margin: 0;
      padding: 0;

      color: #ffffff;
      font-size: clamp(0.9rem, 3.5vw, 1.2rem);
      line-height: 1.5;
      font-weight: 700;
      text-align: center;

      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);

      overflow-wrap: anywhere;
      word-break: normal;
    }

    /* Espace central */
    .welcome-spacer {
      flex: 1 1 auto;
      min-height: 40px;
      width: 100%;
    }

    /* Bouton Entrer */
    .welcome-footer {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 0 20px;
      padding: 0;
    }

    .welcome-footer .enter-btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;

      max-width: 100%;
      padding: 12px 30px;

      text-align: center;
      white-space: normal;
    }

    /* Smartphones */
    @media (max-width: 600px) {
      body.welcome-body {
        padding: 20px 12px;
        gap: 16px;

        /* Évite les problèmes de fond fixe sur mobile */
        background-attachment: scroll;
      }

      .main-container.welcome-container {
        padding: 0 2px;
      }

      .main-container.welcome-container h1 {
        font-size: clamp(1.6rem, 8.5vw, 2.8rem);
        letter-spacing: 0;
      }

      .welcome-text {
        font-size: clamp(0.85rem, 3.8vw, 1.05rem);
      }

      .welcome-footer {
        margin-bottom: 50px;
      }
    }

    /* Petits écrans en mode paysage */
    @media (max-height: 500px) and (orientation: landscape) {
      body.welcome-body {
        padding: 12px 16px;
        gap: 10px;
      }

      .main-container.welcome-container h1 {
        font-size: clamp(1.5rem, 5vw, 2.5rem);
      }

      .welcome-spacer {
        min-height: 10px;
      }

      .welcome-footer {
        margin-bottom: 8px;
      }
    }
  </style>
</head>

<body class="welcome-body">

  <header class="main-container welcome-container">
    <h1>DRAGON BALL FOREVER</h1>

    <p class="welcome-text">
      !! BIENVENUE SUR LE SITE DRAGON BALL FOREVER - 楽しんで !!
    </p>
  </header>

  <div class="welcome-spacer" aria-hidden="true"></div>

  <footer class="welcome-footer">
    <a href="accueil.html" class="enter-btn">ENTRER</a>
  </footer>

</body>
</html>
