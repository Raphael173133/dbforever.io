<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dragon Ball Forever - Accueil</title>
  <meta name="description" content="Ce site parle de l'univers de Dragon Ball, Dragon Ball Z, Dragon Ball Super, Dragon Ball GT, Dragon Ball Daima, les séries TV et les films, les personnages, les attaques spéciales, un forum de discussion, les jeux-vidéos (consoles et mobiles) et toute sorte de goodies">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="welcome-body">

<div class="main-container welcome-container">
      <h1>DRAGON BALL FOREVER</h1>
    
      <p class="welcome-text">!! BIENVENUE SUR LE SITE DRAGON BALL FOREVER !!</p>

      <!-- Bouton Entrer -->
      <a href="accueil.html" class="enter-btn" onclick="playAudioAndEnter(event)">ENTRER</a>

      <!-- Élément audio masqué -->
      <audio id="welcome-audio" src="dragonball_opening.mp3" preload="auto" loop></audio>
</div>

<script>
  function playAudioAndEnter(event) {
    event.preventDefault(); 
    const audio = document.getElementById('welcome-audio');
    
    audio.play().then(() => {
      // On sauvegarde l'état de lecture dans la mémoire du navigateur
      localStorage.setItem('db_music_playing', 'true');
      
      setTimeout(() => {
        window.location.href = "accueil.html"; // Redirection vers la page encyclopédie
      }, 300); 
    }).catch(() => {
      window.location.href = "accueil.html"; // Redirection en cas de blocage audio
    });
  }
</script>

</body>
</html>
